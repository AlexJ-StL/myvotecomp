[project]
name = "myvotecomp"
version = "0.1.0"
description = "U.S. election candidate vote totals, state demographics, and voter registration data pipeline."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "pyarrow>=18.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pytest-cov>=7.1.0",
    "sqlalchemy>=2.0.0",
]
# Application project, not a package library
[tool.uv]
package = false

# Build-system commented out so hatchling isn't invoked during sync
# [build-system]
# requires = ["hatchling"]
# build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
# Enable Pyflakes (F), pycodestyle (E, W), isort (I), pyupgrade (UP), and Ruff-specific rules (RUF)
select = ["E", "W", "F", "I", "UP", "RUF"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["config", "models", "ingest", "pipeline"]
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = "."
addopts = "-v --tb=short"
